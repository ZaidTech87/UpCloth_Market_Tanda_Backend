# =====================================================================
# ClothMarket backend configuration
# Every secret comes from an environment variable (or a local .env file,
# which spring-dotenv loads automatically). Nothing secret lives here.
# See ../../../../.env.example for the full list of variables.
# =====================================================================
spring.config.import=optional:file:./.env[.properties]

# ---- Server -----------------------------------------------------------
server.port=${PORT:8080}
server.servlet.context-path=/api
# Render (and most PaaS) terminate TLS in a reverse proxy. "native" lets
# Tomcat resolve the real client IP from X-Forwarded-For, but only when the
# request comes from a trusted (private-range) proxy, so clients cannot
# spoof their IP to dodge the rate limiter.
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---- Database (Supabase PostgreSQL) ----------------------------------
# DB_URL, DB_USERNAME and DB_PASSWORD are REQUIRED (no defaults, so a missing value fails at startup
# instead of connecting to the wrong database). See backend/.env.example.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Keep the pool small: Supabase's pooler and database have connection limits.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1500000



# "update" only ever ADDS columns/tables (never drops). For a managed
# production database prefer "validate" plus explicit migrations
# (see docs/DEPLOYMENT.md) and set DDL_AUTO=validate.
# NOTE (email OTP): users.email is added by docs/sql/001_add_user_email.sql, which
# also creates the unique index. Run that script in the Supabase SQL editor.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# ---- Uploads ----------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.file-size-threshold=2KB
# Per-type limits enforced in StorageService (bytes)
upload.max-image-bytes=${UPLOAD_MAX_IMAGE_BYTES:10485760}
upload.max-video-bytes=${UPLOAD_MAX_VIDEO_BYTES:52428800}
upload.max-audio-bytes=${UPLOAD_MAX_AUDIO_BYTES:10485760}

# ---- CORS (web frontend). Android's native HTTP client is not subject to CORS.
allowed.origins=${ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# ---- JWT --------------------------------------------------------------
# JWT_SECRET is REQUIRED (min 32 characters). The app refuses to start without it.
jwt.secret=${JWT_SECRET}
# Default: 7 days
jwt.expiration=${JWT_EXPIRATION_MS:604800000}

# ---- WebSocket / STOMP -----------------------------------------------
# When true (default) every STOMP CONNECT must carry "Authorization: Bearer <jwt>".
# Set WS_AUTH_REQUIRED=false ONLY as a temporary migration aid for a web
# client that does not send the header yet (see docs/DEPLOYMENT.md).
websocket.auth-required=${WS_AUTH_REQUIRED:true}

# ---- Email OTP (Resend) -----------------------------------------------
# OTPs for signup and password reset are emailed through the Resend REST API.
# RESEND_API_KEY and MAIL_FROM come ONLY from environment variables / backend/.env.
# MAIL_FROM must be an address on a domain verified in Resend, for example:
#   ClothMarket <no-reply@your-verified-domain.com>
# (Until a domain is verified Resend only delivers to your own account email.)
resend.api-key=${RESEND_API_KEY:}
resend.api-url=https://api.resend.com/emails
mail.from=${MAIL_FROM:}

otp.ttl-seconds=${OTP_TTL_SECONDS:300}
otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
otp.resend-cooldown-seconds=${OTP_RESEND_COOLDOWN_SECONDS:60}

# DEV ONLY: print the OTP to the log instead of (or as well as) emailing it.
# Never enable in production: it writes one-time codes to the logs.
otp.log-to-console=${OTP_LOG_TO_CONSOLE:false}

# ---- Login brute-force protection (per email address) -----------------
auth.max-failed-logins=${AUTH_MAX_FAILED_LOGINS:5}
auth.lockout-minutes=${AUTH_LOCKOUT_MINUTES:15}

# ---- Cloudflare R2 media storage (PRIVATE bucket) ---------------------
# All media lives in a private R2 bucket and is served through short-lived signed URLs.
# Values come ONLY from environment variables / backend/.env. Never put real values here.
# R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY and R2_BUCKET_NAME are REQUIRED:
# the app refuses to start without them (there is no local-disk fallback).
r2.account-id=${R2_ACCOUNT_ID:}
r2.access-key-id=${R2_ACCESS_KEY_ID:}
r2.secret-access-key=${R2_SECRET_ACCESS_KEY:}
r2.bucket-name=${R2_BUCKET_NAME:}
# Optional. Default is https://<account-id>.r2.cloudflarestorage.com ; must NOT include the bucket name.
r2.endpoint=${R2_ENDPOINT:}
# Signed URL lifetimes in seconds (1..604800). Voice messages are private, so they use the shorter one.
r2.signed-url-ttl-voice-seconds=${R2_SIGNED_URL_TTL_VOICE_SECONDS:3600}
r2.signed-url-ttl-media-seconds=${R2_SIGNED_URL_TTL_MEDIA_SECONDS:21600}

# ---- Chatbot (Groq, OpenAI-compatible) --------------------------------
groq.api.key=${GROQ_API_KEY:}
groq.api.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.api.url=https://api.groq.com/openai/v1/chat/completions

# ---- Moderation (Sightengine) -----------------------------------------
sightengine.api.user=${SIGHTENGINE_API_USER:}
sightengine.api.secret=${SIGHTENGINE_API_SECRET:}
sightengine.api.url=https://api.sightengine.com/1.0/check.json
# true = reject uploads when moderation is unconfigured / unreachable
moderation.fail-closed=${MODERATION_FAIL_CLOSED:false}

# ---- Logging ----------------------------------------------------------
# Keep WebSocket/STOMP tracing OFF in production (it logs every frame,
# including Authorization headers). Raise temporarily with the env vars.
logging.level.root=${ROOT_LOG_LEVEL:INFO}
logging.level.com.clothmarket=${APP_LOG_LEVEL:INFO}
logging.level.org.springframework.web=${SPRING_LOG_LEVEL:WARN}
logging.level.org.springframework.web.socket=${WS_LOG_LEVEL:WARN}
logging.level.org.springframework.messaging=${WS_LOG_LEVEL:WARN}

# Do not leak stack traces / internal messages in default error bodies
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# TZ for Render: set env TZ=Asia/Kolkata if you need IST timestamps.

# ---- Consent / legal pages (served by LegalController) ------------------
# Require "I accept the Terms and Privacy Policy and am 18+" at signup.
# Set LEGAL_REQUIRE_CONSENT=false only while a web client that does not send
# acceptTerms is still in use.
legal.require-consent=${LEGAL_REQUIRE_CONSENT:true}
legal.terms-version=${LEGAL_TERMS_VERSION:1}
# The pages answer 503 until ALL of these are set (no placeholder text goes live).
legal.company-name=${LEGAL_COMPANY_NAME:}
legal.support-email=${LEGAL_SUPPORT_EMAIL:}
legal.grievance-officer-name=${LEGAL_GRIEVANCE_OFFICER_NAME:}
legal.grievance-officer-email=${LEGAL_GRIEVANCE_OFFICER_EMAIL:}
legal.address=${LEGAL_POSTAL_ADDRESS:}
legal.effective-date=${LEGAL_EFFECTIVE_DATE:}

# ---- Moderation / reports -----------------------------------------------
# Comma-separated user ids allowed to call /api/admin/** (empty = nobody).
admin.user-ids=${ADMIN_USER_IDS:}
reports.max-per-day=${REPORTS_MAX_PER_DAY:20}

# ---- Signup ownership check ----------------------------------------------
# true (default) = signup needs an OTP emailed to the address being registered (needs RESEND_API_KEY
# and MAIL_FROM, or OTP_LOG_TO_CONSOLE=true in development). false = any email can register
# without proving ownership.
signup.require-otp=${SIGNUP_REQUIRE_OTP:true}